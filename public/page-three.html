<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"> 
  <meta name="viewport" content="width=device-width, initial-scale=1"> 
  <title>Page Two</title>
  <meta name="description" content="A minimal, static page."> 
  <link rel="stylesheet" href="style.css"> 
</head>
<body>
  <header class="site-header">
    <nav class="nav" aria-label="Primary">
      <button class="menu-toggle" aria-expanded="false" aria-controls="primary-links">Menu</button>
      <div id="primary-links" class="links">
        <a href="index.html">Home</a>
        <a href="page-two.html" aria-current="page">Page Two</a>
        <a href="page-three.html">Page Three</a>
      </div>
    </nav>
  </header>

  <main class="container">
    <h1>Page Two</h1>
    <p>Just a simple page with neutral text. Nothing to see here, and that's the point.</p>

    <details>
      <summary>More (not much)</summary>
      <p>Expandable content to demonstrate basic semantics without adding any personal information.</p>
    </details>
  </main>

  <footer class="site-footer">
    <small>© <span id="year"></span></small>
  </footer>
  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
    const btn = document.querySelector('.menu-toggle');
    const links = document.getElementById('primary-links');
    if (btn && links) {
      btn.addEventListener('click', () => {
        const expanded = btn.getAttribute('aria-expanded') === 'true';
        btn.setAttribute('aria-expanded', String(!expanded));
        links.classList.toggle('open', !expanded);
      });
    }
  </script>
</body>
</html>
